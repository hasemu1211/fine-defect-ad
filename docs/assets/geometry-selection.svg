<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 640 540"><style>text{font-family:system-ui,sans-serif;fill:#172033}.t{font-size:22px;font-weight:700}.s{font-size:16px;fill:#526070}.n{font-size:15px;fill:#526070}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="34" class="t">타일 경계 처리 결정: 256×256 기준 경로 유지</text><text x="24" y="60" class="s">검증 정상 이미지 쌍 비교 · 결정 DEC-GEO-002</text><rect x="24" y="90" width="592" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="44" y="122" class="t">256×256 기준 경로</text><text x="44" y="150" class="s">내부 식별자: E1 · 범위·무결성·시임 게이트 통과</text><text x="44" y="180" class="s">결정: 기준 경로 유지</text><rect x="24" y="266" width="592" height="166" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="44" y="298" class="t">전체 분기 타일링 경로</text><text x="44" y="326" class="s">legacy E2 · border 기록: 16 → 80 → 60 px</text><text x="44" y="356" class="s">시임/원점 안정성: 미통과 · 미채택</text><text x="24" y="474" class="n">DEC-GEO-002는 후속 분기 분리형 고해상도 타일링 후보</text><text x="24" y="498" class="n">(DEC-SPLIT-003)와 별개의 기하 결정입니다.</text><text x="24" y="522" class="n">이 결정에는 TESTpub·OOD 입력을 사용하지 않았습니다.</text></svg>
