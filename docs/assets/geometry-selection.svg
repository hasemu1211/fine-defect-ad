<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><style>text{font-family:system-ui,sans-serif;fill:#172033}.t{font-size:18px;font-weight:700}.s{font-size:12px;fill:#526070}.n{font-size:11px;fill:#526070}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="28" y="30" class="t">기하 전처리 선택: E1 유지</text><text x="28" y="52" class="s">검증 데이터 전용 쌍 비교 · 결정 DEC-GEO-002</text><rect x="42" y="82" width="260" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="62" y="112" class="t">E1 — 선택</text><text x="62" y="140" class="s">범위·무결성·시임 게이트 통과</text><text x="62" y="164" class="s">선택값: E1</text><rect x="414" y="82" width="260" height="150" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="434" y="112" class="t">E2 — 제외</text><text x="434" y="140" class="s">후보 16 → 시도 80 → 관측 60</text><text x="434" y="160" class="s">상태:</text><text x="434" y="180" class="n">REVISION_UNSTABLE_RETAIN_E1</text><text x="434" y="202" class="s">시임/원점: false</text><path d="M322 156h70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#64748b"/></marker></defs><text x="28" y="270" class="n">E2 시임/원점 게이트 실패로 E1을 유지했으며, 테스트·OOD 조정은 수행하지 않았습니다.</text></svg>
