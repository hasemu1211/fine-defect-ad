<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330"><style>text{font-family:system-ui,sans-serif;fill:#172033}.t{font-size:18px;font-weight:700}.s{font-size:12px;fill:#526070}.n{font-size:11px;fill:#526070}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="28" y="30" class="t">타일 경계 처리 결정: 256×256 기준 경로 유지</text><text x="28" y="52" class="s">검증 정상 이미지 쌍 비교 · 결정 DEC-GEO-002</text><rect x="42" y="82" width="290" height="160" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="62" y="112" class="t">256×256 기준 경로</text><text x="62" y="140" class="s">내부 식별자: E1</text><text x="62" y="164" class="s">범위·무결성·시임 게이트 통과</text><text x="62" y="188" class="s">결정: 기준 경로 유지</text><rect x="488" y="82" width="290" height="160" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="508" y="112" class="t">전체 분기 타일링 경로</text><text x="508" y="140" class="s">legacy E2</text><text x="508" y="164" class="s">border 기록: 16 → 80 → 60 px</text><text x="508" y="188" class="s">시임/원점 안정성: 미통과 · 미채택</text><text x="382" y="164" class="n">쌍 비교</text><text x="28" y="282" class="n">DEC-GEO-002는 후속 분기 분리형 고해상도 타일링 후보(DEC-SPLIT-003)와 별개의 기하 결정입니다.</text><text x="28" y="304" class="n">이 결정에는 TESTpub·OOD 입력을 사용하지 않았습니다.</text></svg>
