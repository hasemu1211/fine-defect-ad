<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="490" viewBox="0 0 1120 490"><style>text{font-family:system-ui,sans-serif;fill:#172033}.t{font-size:18px;font-weight:700}.s{font-size:12px;fill:#526070}.n{font-size:11px;fill:#526070}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="48" class="t">TensorRT FP32 + Triton: 측정 요약</text><text x="48" y="74" class="s">대표 단일 이미지 지연과 114-image backend A/B 평가는 서로 다른 측정입니다.</text><rect x="48" y="104" width="1024" height="112" rx="12" fill="#e0f2fe" stroke="#64748b"/><text x="72" y="138" class="t">대표 고해상도 E2E 지연</text><text x="72" y="168" class="s">TorchScript B4 2.4610 s/image → TensorRT FP32 2.1040 s/image</text><text x="72" y="196" class="t">14.5% 감소</text><text x="438" y="138" class="s">단일 대표 이미지 · 256 tiles · 서버 준비 후 측정</text><text x="438" y="168" class="s">실시간 처리량 또는 운영 SLA 주장이 아님</text><rect x="48" y="242" width="498" height="184" rx="12" fill="#f8fafc" stroke="#64748b"/><text x="72" y="276" class="t">TESTpub backend A/B · 114 images</text><text x="72" y="306" class="s">동일 체크포인트 · 재보정/튜닝 없음</text><text x="72" y="340" class="s">Image AU-ROC  0.734722 → 0.733333 (-0.001389)</text><text x="72" y="372" class="s">AU-PRO@0.05  0.132685 → 0.132769 (+0.000084)</text><text x="72" y="402" class="n">총 evaluator 시간은 114장 전체 실행 시간이며, 대표 지연과 직접 비교하지 않습니다.</text><rect x="574" y="242" width="498" height="184" rx="12" fill="#f8fafc" stroke="#64748b"/><text x="598" y="276" class="t">검증·실행 결속</text><text x="598" y="306" class="s">검증 이미지 3장: 이미지 판정 동일</text><text x="598" y="338" class="s">측정 불확실성 대역 밖 판정 flip: 0</text><text x="598" y="370" class="s">서버 준비 후 GPU reserved peak: 444.0 MiB</text><text x="598" y="402" class="n">고정 Triton image digest: sha256:a40838bb…e28dbfc7</text><text x="560" y="460" class="n" text-anchor="middle">후보 백엔드의 수치 보존과 추적성 검증 결과이며, production promotion 결론은 아닙니다.</text></svg>
